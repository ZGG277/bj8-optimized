<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>公主请开球</title>
    <meta name="description" content="城堡与湖面之间的水晶球桌、宝石球与象牙白球杆。打开即可开球。" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23163659'/%3E%3Ccircle cx='32' cy='36' r='18' fill='%23bc294b' stroke='%23edcc85' stroke-width='2'/%3E%3Cpath d='M17 11l8 7 7-10 7 10 8-7-4 14H21z' fill='%23edcc85'/%3E%3Ccircle cx='26' cy='30' r='5' fill='%23fff' opacity='.6'/%3E%3C/svg%3E" />
    <style>
      html,body{margin:0;background:#f5eee1} .boot-card{box-sizing:border-box;position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;color:#73552c;background:radial-gradient(ellipse at 50% 40%,#fffaf0,#e5dac6);font-family:Georgia,'Songti SC',serif}.boot-card span{font-size:12px;letter-spacing:.25em}.boot-card h1{font-size:24px;font-weight:500;line-height:1.7}.boot-card p{font:14px/1.8 sans-serif;max-width:360px}.boot-card button{min-height:48px;border:1px solid #a98748;border-radius:24px;background:#fff7e7;color:#694b24;padding:10px 26px;font:16px sans-serif}
    .boot-spinner{width:22px;height:22px;border:1px solid #8c9c8233;border-top-color:#75866b;border-radius:50%;animation:boot-spin 1s linear infinite}@keyframes boot-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.boot-spinner{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-card" role="status"><span class="boot-spinner" aria-hidden="true"></span><h1>公主请开球</h1></div></div>
    <noscript>请启用 JavaScript 后重新打开。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
